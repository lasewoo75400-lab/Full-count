<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road to KBO - CRAK Style Baseball Interactive</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0d0f12; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; min-height: 100vh; padding: 0; }
        
        #app { width: 100%; max-width: 500px; background: #13171d; border-left: 1px solid #21262d; border-right: 1px solid #21262d; display: flex; flex-direction: column; height: 100vh; position: relative; }
        
        /* Top Header & Status Bar */
        .top-header { background: #1c2128; padding: 12px 16px; border-bottom: 1px solid #2d333b; display: flex; align-items: center; justify-content: space-between; }
        .player-info { display: flex; align-items: center; gap: 10px; }
        .avatar-circle { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #2563eb, #7c3aed); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.1rem; color: #fff; box-shadow: 0 2px 8px rgba(37,99,235,0.4); }
        .player-detail { display: flex; flex-direction: column; }
        .player-name { font-weight: 700; font-size: 0.95rem; color: #f0f6fc; }
        .player-sub { font-size: 0.75rem; color: #8b949e; }
        .stat-badge { background: #21262d; border: 1px solid #363b42; border-radius: 20px; padding: 4px 10px; font-size: 0.75rem; color: #58a6ff; font-weight: 600; }

        /* Status Grid Overlay Modal (Optional/Toggle) */
        .stats-summary { background: #161b22; padding: 8px 16px; border-bottom: 1px solid #21262d; display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; font-size: 0.75rem; color: #8b949e; }
        .stats-summary div b { display: block; color: #f0f6fc; font-size: 0.85rem; margin-top: 2px; }

        /* Chat Stream Area */
        #chat-stream { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; background: #0d0f12; }
        
        /* CRAK Message Cards */
        .msg-row { display: flex; gap: 10px; margin-bottom: 4px; }
        .msg-row.user { flex-direction: row-reverse; }

        .sender-avatar { width: 34px; height: 34px; border-radius: 50%; background: #30363d; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; flex-shrink: 0; color: #38daf0; border: 1px solid #444c56; }
        
        .msg-content { max-width: 82%; }
        .sender-name { font-size: 0.75rem; color: #8b949e; margin-bottom: 4px; display: block; }
        .msg-row.user .sender-name { text-align: right; }

        .bubble { padding: 12px 14px; border-radius: 14px; font-size: 0.88rem; line-height: 1.55; word-break: break-word; }
        .bubble-ai { background: #1c2128; color: #e6edf3; border: 1px solid #2d333b; border-top-left-radius: 2px; }
        .bubble-user { background: #2563eb; color: #ffffff; border-top-right-radius: 2px; }
        .bubble-system { background: #161b22; color: #d2a8ff; border: 1px dashed #30363d; text-align: center; width: 100%; font-size: 0.8rem; padding: 8px 12px; }

        /* CRAK Narration / Action Italics */
        .narration { color: #9198a1; font-style: italic; margin-bottom: 6px; font-size: 0.85rem; display: block; line-height: 1.4; }

        /* Bottom Controls / Choices Area */
        .bottom-area { background: #1c2128; border-top: 1px solid #2d333b; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        
        .choice-container { display: flex; flex-direction: column; gap: 6px; max-height: 180px; overflow-y: auto; }
        .choice-btn { background: #2d333b; border: 1px solid #444c56; color: #e6edf3; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; text-align: left; cursor: pointer; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .choice-btn:hover { background: #3c444d; border-color: #58a6ff; color: #fff; }
        .choice-btn span.tag { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; background: #21262d; color: #58a6ff; }

        /* Free Text Input (CRAK Style) */
        .text-input-row { display: flex; gap: 8px; margin-top: 4px; }
        .text-input-row input { flex: 1; background: #0d0f12; border: 1px solid #30363d; border-radius: 20px; padding: 10px 14px; color: #fff; font-size: 0.85rem; outline: none; }
        .text-input-row input:focus { border-color: #2563eb; }
        .text-input-row button { background: #2563eb; color: #fff; border: none; border-radius: 50%; width: 38px; height: 38px; cursor: pointer; font-weight: bold; flex-shrink: 0; }

        /* Allocator & Profile UI */
        .profile-form { display: flex; flex-direction: column; gap: 10px; background: #161b22; padding: 14px; border-radius: 10px; border: 1px solid #30363d; }
        .profile-form label { font-size: 0.75rem; color: #8b949e; font-weight: 600; }
        .profile-form input { background: #0d0f12; border: 1px solid #30363d; padding: 8px 10px; border-radius: 6px; color: #fff; font-size: 0.85rem; }
        .stat-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; }
        .stat-btn { background: #21262d; border: 1px solid #363b42; color: #fff; width: 26px; height: 26px; border-radius: 4px; cursor: pointer; }

        /* Epilogue Result Card */
        #result-card { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 88%; background: #161b22; border: 2px solid #58a6ff; border-radius: 12px; padding: 20px; z-index: 100; text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
    </style>
</head>
<body>

<div id="app">
    <!-- Header -->
    <div class="top-header">
        <div class="player-info">
            <div class="avatar-circle" id="ui-avatar">야</div>
            <div class="player-detail">
                <span class="player-name" id="ui-name">선수 생성 중</span>
                <span class="player-sub" id="ui-sub">입학 준비 단계</span>
            </div>
        </div>
        <div class="stat-badge" id="ui-ovr-badge">OVR -</div>
    </div>

    <!-- Quick Stats -->
    <div class="stats-summary">
        <div>타격 <b id="ui-off">0</b></div>
        <div>수비 <b id="ui-def">0</b></div>
        <div>주력 <b id="ui-spd">0</b></div>
        <div>신임도 <b id="ui-tru">0%</b></div>
    </div>

    <!-- CRAK Chat Stream -->
    <div id="chat-stream"></div>

    <!-- Bottom Action Controls -->
    <div class="bottom-area">
        <div class="choice-container" id="choice-box"></div>
        <div class="text-input-row" id="custom-input-box" style="display:none;">
            <input type="text" id="user-text-input" placeholder="대사나 행동을 직접 입력해보세요..." onkeypress="if(event.key==='Enter') sendCustomAction()">
            <button onclick="sendCustomAction()">➔</button>
        </div>
    </div>

    <!-- Result Card -->
    <div id="result-card">
        <h3 style="color:#58a6ff; margin-bottom:8px;">🏆 명예의 전당 스토리 카드</h3>
        <p id="card-title" style="color:#f2e05a; font-weight:bold; font-size:0.9rem; margin-bottom:12px;"></p>
        <div id="card-stats" style="text-align:left; background:#0d0f12; padding:12px; border-radius:8px; font-size:0.8rem; line-height:1.7; margin-bottom:12px; color:#c9d1d9;"></div>
        <button class="choice-btn" style="justify-content:center; width:100%; font-weight:bold; background:#2563eb; border:none;" onclick="location.reload()">새로운 캐릭터로 시작하기</button>
    </div>
</div>

<script>
    var p = {
        name: "김야구",
        school: "덕수고등학교",
        height: 184,
        weight: 83,
        posMain: "타자",
        offense: 10,
        defense: 10,
        speed: 10,
        mental: 20,
        trust: 10,
        age: 16,
        grade: 1,
        month: 3,
        week: 1,
        hits: 0,
        hr: 0,
        kboYears: 0,
        contractMoney: 0,
        team: "덕수고 1학년",
        storyStep: 0
    };

    var statPts = 40;

    function getOvr() {
        return Math.floor((p.offense + p.defense + p.speed + p.mental) / 4);
    }

    function updateHeader() {
        document.getElementById("ui-name").innerText = p.name + " (" + p.age + "세)";
        document.getElementById("ui-sub").innerText = p.team + " | " + p.month + "월 " + p.week + "주차";
        document.getElementById("ui-avatar").innerText = p.name.substring(0, 1);
        document.getElementById("ui-ovr-badge").innerText = "OVR " + getOvr();
        
        document.getElementById("ui-off").innerText = p.offense;
        document.getElementById("ui-def").innerText = p.defense;
        document.getElementById("ui-spd").innerText = p.speed;
        document.getElementById("ui-tru").innerText = p.trust + "%";
    }

    /* CRAK Chat Stream Helpers */
    function addAIMessage(sender, avatarChar, text, narration) {
        var stream = document.getElementById("chat-stream");
        var html = '<div class="msg-row">' +
            '<div class="sender-avatar">' + avatarChar + '</div>' +
            '<div class="msg-content">' +
                '<span class="sender-name">' + sender + '</span>' +
                '<div class="bubble bubble-ai">' +
                    (narration ? '<span class="narration">' + narration + '</span>' : '') +
                    '<span>' + text + '</span>' +
                '</div>' +
            '</div>' +
        '</div>';
        stream.insertAdjacentHTML('beforeend', html);
        stream.scrollTop = stream.scrollHeight;
    }

    function addUserMessage(text) {
        var stream = document.getElementById("chat-stream");
        var html = '<div class="msg-row user">' +
            '<div class="msg-content">' +
                '<span class="sender-name">' + p.name + '</span>' +
                '<div class="bubble bubble-user">' + text + '</div>' +
            '</div>' +
        '</div>';
        stream.insertAdjacentHTML('beforeend', html);
        stream.scrollTop = stream.scrollHeight;
    }

    function addSystemNotice(text) {
        var stream = document.getElementById("chat-stream");
        var html = '<div class="bubble bubble-system">' + text + '</div>';
        stream.insertAdjacentHTML('beforeend', html);
        stream.scrollTop = stream.scrollHeight;
    }

    /* Step 1: Character Setup Form */
    function initGame() {
        updateHeader();
        addAIMessage("크랙 안내 AI", "🤖", "반갑습니다! KBO 야구 대서사시의 주인공이 될 캐릭터 프로필을 등록해 주세요.", "*새로운 인터랙티브 스토리를 시작합니다.*");
        
        var box = document.getElementById("choice-box");
        box.innerHTML = '<div class="profile-form">' +
            '<label>선수 이름</label><input type="text" id="inp-name" value="강백호">' +
            '<label>출신 고등학교</label><input type="text" id="inp-school" value="덕수고등학교">' +
            '<div style="display:flex; gap:10px;">' +
                '<div style="flex:1;"><label>신장 (cm)</label><input type="number" id="inp-h" value="185"></div>' +
                '<div style="flex:1;"><label>체중 (kg)</label><input type="number" id="inp-w" value="84"></div>' +
            '</div>' +
            '<button class="choice-btn" style="justify-content:center; background:#2563eb; margin-top:6px;" onclick="submitProfile()">프로필 생성 완료</button>' +
        '</div>';
    }

    function submitProfile() {
        p.name = document.getElementById("inp-name").value.trim() || "강백호";
        p.school = document.getElementById("inp-school").value.trim() || "덕수고등학교";
        p.height = parseInt(document.getElementById("inp-h").value) || 185;
        p.weight = parseInt(document.getElementById("inp-w").value) || 84;
        p.team = p.school + " 1학년";

        addUserMessage("내 이름은 " + p.name + ". " + p.school + "에 입학한 신입생이다. (피지컬: " + p.height + "cm, " + p.weight + "kg)");
        showStatAllocator();
    }

    /* Step 2: Stat Point Allocator */
    function showStatAllocator() {
        updateHeader();
        addAIMessage("시스템", "⚙️", "야구 재능 포인트를 직접 배분하여 선수 유형을 완성하세요.", "*남은 포인트: " + statPts + "*");
        
        renderAllocatorUI();
    }

    function renderAllocatorUI() {
        var box = document.getElementById("choice-box");
        box.innerHTML = '<div class="profile-form">' +
            '<div style="text-align:center; font-size:0.8rem; color:#58a6ff; font-weight:bold; margin-bottom:6px;">할당 가능 포인트: <span id="pts-lbl">' + statPts + '</span>pt</div>' +
            '<div class="stat-row"><span>타격 능력 (Offense)</span><div><button class="stat-btn" onclick="adjStat(\'offense\',-1)">-</button> <b id="st-off">' + p.offense + '</b> <button class="stat-btn" onclick="adjStat(\'offense\',1)">+</button></div></div>' +
            '<div class="stat-row"><span>수비 능력 (Defense)</span><div><button class="stat-btn" onclick="adjStat(\'defense\',-1)">-</button> <b id="st-def">' + p.defense + '</b> <button class="stat-btn" onclick="adjStat(\'defense\',1)">+</button></div></div>' +
            '<div class="stat-row"><span>주력/순발력 (Speed)</span><div><button class="stat-btn" onclick="adjStat(\'speed\',-1)">-</button> <b id="st-spd">' + p.speed + '</b> <button class="stat-btn" onclick="adjStat(\'speed\',1)">+</button></div></div>' +
            '<div class="stat-row"><span>멘탈/배짱 (Mental)</span><div><button class="stat-btn" onclick="adjStat(\'mental\',-1)">-</button> <b id="st-men">' + p.mental + '</b> <button class="stat-btn" onclick="adjStat(\'mental\',1)">+</button></div></div>' +
            '<button class="choice-btn" style="justify-content:center; background:#2563eb; margin-top:8px;" onclick="startCrakStory()">스탯 확정 및 입부식 진행</button>' +
        '</div>';
    }

    function adjStat(key, amount) {
        if(amount > 0 && statPts > 0) {
            p[key] += 1;
            statPts -= 1;
        } else if(amount < 0 && p[key] > 10) {
            p[key] -= 1;
            statPts += 1;
        }
        updateHeader();
        renderAllocatorUI();
    }

    /* Step 3: CRAK Style Interactive Story Flow */
    function startCrakStory() {
        p.storyStep = 1;
        document.getElementById("custom-input-box").style.display = "flex"; // 자유입력 활성화
        updateHeader();

        addSystemNotice("3월 입학식 직후 - " + p.school + " 야구부 그라운드");
        
        addAIMessage(
            "노성구 감독", 
            "감독", 
            "\"어이, 거기 신입생. 얼버무리지 말고 빨리 흙 털어내라. 1학년은 아직 유니폼도 없다. 파울볼이나 잘 주워 둬.\"",
            "*어깨에 굵은 힘줄이 솟은 노성구 감독이 훈련장 벤치에 턱을 괴고 당신을 가만히 내려다본다.*"
        );

        showStoryChoices([
            { text: "\"알겠습니다! 파울볼 줍기부터 확실하게 하겠습니다.\"", action: "submissive", tag: "성실함/신임도+" },
            { text: "\"감독님, 저는 볼 주우러 온 게 아닙니다. 배팅 케이지에 세워주십시오.\"", action: "bold", tag: "배짱/멘탈+" },
            { text: "*말없이 묵묵히 그라운드로 달려가 남들보다 빠르게 볼을 줍기 시작한다.*", action: "silent", tag: "수비/기본기+" }
        ]);
    }

    function handleStoryAction(actionType, customText) {
        var userSay = customText || "";

        if(p.storyStep === 1) {
            if(actionType === 'submissive') {
                p.trust += 10;
                userSay = "\"알겠습니다! 파울볼 줍기부터 확실하게 하겠습니다.\"";
            } else if(actionType === 'bold') {
                p.mental += 10; p.trust -= 5;
                userSay = "\"감독님, 저는 볼 주우러 온 게 아닙니다. 배팅 케이지에 세워주십시오.\"";
            } else {
                p.defense += 5;
                userSay = "*말없이 묵묵히 그라운드로 달려가 볼을 줍기 시작한다.*";
            }
            addUserMessage(userSay);

            p.storyStep = 2;
            setTimeout(function() {
                addAIMessage(
                    "노성구 감독",
                    "감독",
                    "\"눈빛은 살아있군... 좋아. 이번 주 토요일 충암고와의 연습경기가 있다. 주전 외야수가 다쳤으니 백업으로 대기해라. 사고 치지 말고.\"",
                    "*감독이 입꼬리를 살짝 올리며 당신의 이름이 적힌 명단을 체크한다.*"
                );

                showStoryChoices([
                    { text: "\"감사합니다 감독님! 반드시 기대에 부응하겠습니다.\"", action: "step2_yes", tag: "신임도+" },
                    { text: "*상대팀 충암고 에이스 투수의 전력 분석 노트부터 작성한다.*", action: "step2_study", tag: "수비/제구+" }
                ]);
            }, 600);
        }
        else if(p.storyStep === 2) {
            if(actionType === 'step2_yes') {
                p.trust += 10;
                userSay = "\"감사합니다 감독님! 기대에 부응하겠습니다.\"";
            } else {
                p.defense += 5;
                userSay = "*충암고 투수의 구종과 투구 폼을 밤새 연구한다.*";
            }
            addUserMessage(userSay);

            p.storyStep = 3;
            setTimeout(function() {
                addSystemNotice("5월 주말 연습경기 vs 충암고등학교");
                addAIMessage(
                    "백건우 (충암고 라이벌)",
                    "건우",
                    "\"네가 덕수고 1학년 신입생이냐? 폼 보니까 공 하나 건드리기도 힘들어 보이는데?\"",
                    "*마운드 위 145km/h 강속구를 던지는 백건우가 당신을 보며 비웃음을 짓는다.*"
                );

                showStoryChoices([
                    { text: "\"말이 많네. 공이나 똑바로 던져라.\"", action: "step3_provoke", tag: "도발/장타" },
                    { text: "*아무 말 없이 헬멧 끈을 조여 매고 타석 깊숙이 들어선다.*", action: "step3_focus", tag: "집중/안타" }
                ]);
            }, 600);
        }
        else if(p.storyStep === 3) {
            addUserMessage(customText || "승부다, 백건우!");
            p.storyStep = 4; // 정규 루프 전환

            var success = Math.random() * 100 < (p.offense * 2.5);
            setTimeout(function() {
                if(success) {
                    p.hits++; p.hr++; p.offense += 3;
                    addAIMessage(
                        "해설위원",
                        "🎙️",
                        "\"깩! 쳤습니다! 까마득히 날아갑니다! 덕수고 1학년 신입생이 백건우의 145km/h 직구를 그대로 통타, 좌월 대형 홈런을 터뜨립니다!\"",
                        "*타구가 담장을 넘어가자 그라운드에 정적이 흐른다.*"
                    );
                } else {
                    p.mental += 3;
                    addAIMessage(
                        "백건우",
                        "건우",
                        "\"삼진! 봤냐? 이게 고교 야구의 벽이다!\"",
                        "*공이 포수 글러브에 사정없이 꽂힌다. 헛스윙 삼진.*"
                    );
                }

                addSystemNotice("스토리 튜토리얼 완료 - 정규 시즌 모드 진입");
                nextMatchTurn();
            }, 600);
        }
    }

    function showStoryChoices(choices) {
        var box = document.getElementById("choice-box");
        var html = "";
        for(var i=0; i<choices.length; i++) {
            var c = choices[i];
            html += '<button class="choice-btn" onclick="handleStoryAction(\'' + c.action + '\')">' +
                '<span>' + c.text + '</span>' +
                (c.tag ? '<span class="tag">' + c.tag + '</span>' : '') +
            '</button>';
        }
        box.innerHTML = html;
    }

    /* Step 4: Regular Game Loop */
    function nextMatchTurn() {
        p.week++;
        if(p.week > 4) {
            p.week = 1;
            p.month++;
            if(p.month > 12) {
                p.month = 1;
                p.age++;
                if(p.grade < 3) p.grade++;
                if(p.grade >= 8) p.kboYears++;
            }
        }

        updateHeader();

        if(p.age >= 38) {
            showEnding();
            return;
        }

        // KBO 드래프트 이벤트
        if(p.age === 18 && p.grade === 3 && p.month === 9) {
            triggerDraftEvent();
            return;
        }

        var rivals = ["충암고", "경북고", "광주일고", "부산고", "LG 트윈스", "KIA 타이거즈", "한화 이글스"];
        var opp = rivals[Math.floor(Math.random() * rivals.length)];

        addSystemNotice(p.month + "월 " + p.week + "주차 경기 vs " + opp);

        var hitRate = Math.min(85, Math.floor(p.offense * 0.9));

        var box = document.getElementById("choice-box");
        box.innerHTML = 
            '<button class="choice-btn" onclick="playMatch(\'swing\', ' + (hitRate - 5) + ')"><span>[풀스윙] 담장을 넘기는 장타를 노린다</span><span class="tag">성공률 ' + (hitRate-5) + '%</span></button>' +
            '<button class="choice-btn" onclick="playMatch(\'contact\', ' + hitRate + ')"><span>[컨택] 정타에 집중해 안타를 만든다</span><span class="tag">성공률 ' + hitRate + '%</span></button>' +
            '<button class="choice-btn" onclick="playMatch(\'eye\', ' + (hitRate + 10) + ')"><span>[볼선구] 공을 끝까지 관찰하며 출루한다</span><span class="tag">볼넷 노림</span></button>';
    }

    function playMatch(type, rate) {
        var roll = Math.random() * 100;
        if(type === 'swing') {
            addUserMessage("*타석에서 강하게 배트를 쥐고 풀스윙을 준비한다.*");
            if(roll < rate) {
                p.hits++; p.hr++; p.offense += 2;
                addAIMessage("캐스터", "🎙️", "\"맞았습니다! 큼직한 타구! 담장을 크게 넘어갑니다! 홈런!\"", "*팬들의 환호성이 경기장에 가득 찹니다.*");
            } else {
                p.trust -= 2;
                addAIMessage("포수", "⚾", "\"헛스윙 삼진 아웃!\"", "*배트가 공중에 허망하게 갈라집니다.*");
            }
        } else if(type === 'contact') {
            addUserMessage("*자세를 낮추고 헛스윙 없이 정타를 노린다.*");
            if(roll < rate) {
                p.hits++; p.offense += 1;
                addAIMessage("캐스터", "🎙️", "\"깨끗한 안타! 중전 안타로 출루합니다!\"", "*타구가 내야를 빠르게 빠져나갑니다.*");
            } else {
                addAIMessage("내야수", "⚾", "\"땅볼 아웃!\"", "*아쉽게 내야 땅볼로 물러납니다.*");
            }
        } else {
            addUserMessage("*투수의 유인구를 신중히 지켜본다.*");
            p.mental += 2;
            addAIMessage("주심", "⚾", "\"볼넷! 1루로 출루하십시오.\"", "*지독한 볼카운트 싸움 끝에 출루합니다.*");
        }

        setTimeout(nextMatchTurn, 1000);
    }

    function sendCustomAction() {
        var inp = document.getElementById("user-text-input");
        var val = inp.value.trim();
        if(!val) return;
        inp.value = "";

        if(p.storyStep > 0 && p.storyStep < 4) {
            handleStoryAction('custom', val);
        } else {
            addUserMessage(val);
            addAIMessage("감독", "⚾", "\"" + val + "? 좋은 기세다! 그 기세로 경기에서 보여줘라!\"", "*당신의 패기에 팀 분위기가 고조됩니다.*");
        }
    }

    function triggerDraftEvent() {
        addSystemNotice("🎉 KBO 신인 드래프트 개막");
        var ovr = getOvr();
        if(ovr >= 50) {
            p.team = "한화 이글스";
            p.contractMoney += 50000;
            p.grade = 8;
            addAIMessage("KBO 총재", "🏆", "\"" + p.school + " " + p.name + "! 1라운드 1순위로 한화 이글스에 지명되었습니다!\"", "*계약금 5억원 상징 패널 전달*");
        } else {
            p.team = "연세대학교";
            p.grade = 4;
            addAIMessage("대학 감독", "🎓", "\"프로 진학은 미뤄졌지만, 우리 연세대에서 최고로 만들어주마.\"", "*대학 리그 입학*");
        }
        setTimeout(nextMatchTurn, 1500);
    }

    function showEnding() {
        document.getElementById("choice-box").style.display = "none";
        document.getElementById("custom-input-box").style.display = "none";

        var card = document.getElementById("result-card");
        document.getElementById("card-title").innerText = "<" + p.name + "> - 전설의 KBO 서사시 완료";
        document.getElementById("card-stats").innerHTML = 
            "• 최종 출신: " + p.school + " ➔ " + p.team + "<br>" +
            "• 체격 스펙: " + p.height + "cm / " + p.weight + "kg<br>" +
            "• 최종 능력치(OVR): <b style='color:#58a6ff;'>" + getOvr() + "</b><br>" +
            "• 통산 안타/홈런: " + p.hits + "개 / " + p.hr + "개<br>" +
            "• 누적 계약 수입: " + (p.contractMoney/10000).toFixed(1) + "억 원";
        card.style.display = "block";
    }

    window.onload = function() {
        initGame();
    };
</script>
</body>
</html>
